name: CodeQL

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published query rules are applied even when nothing changes.
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    # WPF and the Windows-only APIs need a Windows build.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: dotnet build DriveMonitor.sln -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
